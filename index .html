<body>
    <div class="container my-5">
    <div id="result" class="d-flex justify-content-center align-items-center">

    </div>
    <div class="text-center">
        <button onClick="fetchUserData()" class="btn btn-primary mt-5"> Random user</button>
    </div>
 </div>

<script>
    async function fetchUserData() {

        try{
             const response = await fetch("https://randomuser.me/api/")
             const fetchUser = await response.json()
             console.log(fetchUser);
             const user = fetchUser.results[0]

           result.innerHTML = `
             <div class="card p-4 mx-auto">
               <img  src="${user.picture.large}" class="rounded-circle mx-auto" width="120" height="120">
               <p class='text-center'> ${user.name.first} ${user.name.last} </p>
               <p class='text-center'> ${user.email} </p>
               <p class='text-center'> ${user.location.city} </p>
               <p class='text-center'> ${user.phone} </p>

                </div>
           `
        }catch (error){
        console.log(error);
    }
    }
</script>
